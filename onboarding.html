<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veloxis AI — Advisor Profile Setup</title>
  
  <meta name="theme-color" content="#060911">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              950: '#022c22',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
            outfit: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #060911;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .glass-panel {
      background: rgba(11, 17, 30, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-bg-1 {
      position: absolute;
      top: -10%;
      left: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body class="p-4 selection:bg-emerald-500 selection:text-white">

  <div class="glow-bg-1"></div>

  <div class="w-full max-w-md glass-panel rounded-3xl p-8 relative z-10 shadow-2xl border border-slate-800">
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-400 to-indigo-500 p-0.5 shadow-xl mb-3">
        <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
          <i data-lucide="building-2" class="w-6 h-6 text-emerald-400"></i>
        </div>
      </div>
      <h1 class="text-2xl font-black tracking-tight font-outfit text-white">Setup Advisor Profile</h1>
      <p class="text-xs text-slate-400 mt-1 font-mono">Step 1 of 1: RIA Practice Configuration</p>
    </div>

    <div id="obAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-mono border"></div>

    <form onsubmit="handleOnboardingSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 font-mono">Advisor Full Name *</label>
        <input type="text" id="obName" required placeholder="Alex Morgan, CFP®" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 font-mono">RIA Firm Name *</label>
        <input type="text" id="obFirm" required placeholder="Apex Wealth Partners RIA" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors" />
      </div>

      <button type="submit" id="obSubmitBtn" class="w-full mt-2 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm shadow-lg shadow-emerald-950 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
        <span id="obBtnText">Complete Setup & Enter Platform →</span>
      </button>

      <div class="text-center pt-2">
        <a href="/index.html" class="text-xs text-slate-500 hover:text-slate-300 font-mono transition-colors">Skip for now &rarr;</a>
      </div>
    </form>
  </div>

  <script>
    lucide.createIcons();

    const SUPABASE_PROJECT_URL = 'https://mlvyjrevobzaecganmgp.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_rtB-t4wWt2N6P8e_EbHHng_Wopex2g1';
    const sb = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_PUBLISHABLE_KEY);

    let currentUser = null;

    async function checkAuth() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = '/auth.html';
        return;
      }
      currentUser = session.user;
      if (currentUser.user_metadata?.advisor_name) {
        document.getElementById('obName').value = currentUser.user_metadata.advisor_name;
      }
      if (currentUser.user_metadata?.firm_name) {
        document.getElementById('obFirm').value = currentUser.user_metadata.firm_name;
      }
    }
    checkAuth();

    function showAlert(msg, isError = true) {
      const el = document.getElementById('obAlert');
      el.textContent = msg;
      el.className = isError 
        ? "mb-4 p-3 rounded-xl text-xs font-mono border bg-rose-500/10 border-rose-500/30 text-rose-400"
        : "mb-4 p-3 rounded-xl text-xs font-mono border bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
      el.classList.remove('hidden');
    }

    async function handleOnboardingSubmit(e) {
      e.preventDefault();
      const advisorName = document.getElementById('obName').value.trim();
      const firmName = document.getElementById('obFirm').value.trim();
      const btn = document.getElementById('obSubmitBtn');
      const btnText = document.getElementById('obBtnText');

      if (!currentUser) {
        showAlert('No active session found. Redirecting to login...', true);
        setTimeout(() => window.location.href = '/auth.html', 1000);
        return;
      }

      btn.disabled = true;
      btnText.textContent = 'Saving Profile...';

      try {
        const { error } = await sb.from('advisors').update({
          advisor_name: advisorName,
          firm_name: firmName
        }).eq('id', currentUser.id);

        if (error) {
          showAlert('Error saving profile: ' + error.message, true);
          btn.disabled = false;
          btnText.textContent = 'Complete Setup & Enter Platform →';
        } else {
          showAlert('Profile calibrated successfully! Entering workspace...', false);
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 400);
        }
      } catch (err) {
        showAlert('Network error: ' + err.message, true);
        btn.disabled = false;
        btnText.textContent = 'Complete Setup & Enter Platform →';
      }
    }
  </script>
</body>
</html>
