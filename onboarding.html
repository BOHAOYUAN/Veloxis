<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloxis AI - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 500: '#10b981' },
                        indigo: { 400: '#818cf8' },
                        space: '#060911'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #060911;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite ease-in-out alternate;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: rgba(16, 185, 129, 0.15);
            top: -100px; left: -100px;
        }
        .orb-2 {
            width: 500px; height: 500px;
            background: rgba(129, 140, 248, 0.15);
            bottom: -200px; right: -100px;
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-dark {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-dark:focus {
            border-color: #818cf8;
            outline: none;
            box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.25);
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card w-full max-w-md p-8 rounded-2xl relative z-10 mx-4">
        <div class="flex flex-col items-center mb-6 text-center">
            <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-indigo-400 rounded-xl flex items-center justify-center mb-4">
                <i data-lucide="user" class="text-white w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight mb-2">Welcome to Veloxis</h1>
            <p class="text-sm text-gray-400">Set Up Your Advisor Profile</p>
            <p class="text-xs text-indigo-400 mt-2 font-medium">Step 1 of 1: Profile Setup</p>
        </div>

        <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm"></div>

        <form id="onboarding-form" class="space-y-4" onsubmit="handleOnboarding(event)">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Advisor Name</label>
                <input type="text" id="advisor-name" required class="input-dark w-full px-4 py-2.5 rounded-lg text-sm text-white placeholder-gray-500 transition-all" placeholder="Jane Doe">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Firm / RIA Name</label>
                <input type="text" id="firm-name" required class="input-dark w-full px-4 py-2.5 rounded-lg text-sm text-white placeholder-gray-500 transition-all" placeholder="Acme Wealth Management">
            </div>
            
            <div class="pt-4 flex flex-col gap-3">
                <button type="submit" id="submit-btn" class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-indigo-400 hover:from-emerald-400 hover:to-indigo-300 rounded-lg text-sm font-semibold text-white shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center gap-2">
                    <span>Complete Setup & Enter Veloxis &rarr;</span>
                    <i data-lucide="loader-2" class="w-4 h-4 spinner hidden" id="submit-spinner"></i>
                </button>
                
                <button type="button" onclick="skipOnboarding()" class="w-full py-2.5 bg-transparent border border-gray-700 hover:border-gray-500 hover:bg-gray-800/50 rounded-lg text-sm font-medium text-gray-400 transition-all">
                    Skip for now &rarr;
                </button>
            </div>
        </form>
    </div>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://mlvyjrevobzaecganmgp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_rtB-t4wWt2N6P8e_EbHHng_Wopex2g1';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function checkAuth() {
            const { data: { session }, error } = await sb.auth.getSession();
            if (!session) {
                window.location.href = 'auth.html';
                return;
            }
            currentUser = session.user;
        }
        checkAuth();

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        async function handleOnboarding(e) {
            e.preventDefault();
            if (!currentUser) return;

            const advisorName = document.getElementById('advisor-name').value;
            const firmName = document.getElementById('firm-name').value;
            const btn = document.getElementById('submit-btn');
            const spinner = document.getElementById('submit-spinner');

            btn.disabled = true;
            spinner.classList.remove('hidden');

            const { error } = await supabase
                .from('advisors')
                .update({ 
                    advisor_name: advisorName, 
                    firm_name: firmName 
                })
                .eq('id', currentUser.id);

            if (error) {
                showError(error.message);
                btn.disabled = false;
                spinner.classList.add('hidden');
            } else {
                window.location.href = 'index.html';
            }
        }

        function skipOnboarding() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
