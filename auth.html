<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veloxis AI — Advisor Portal Authentication</title>
  
  <!-- PWA & Meta -->
  <meta name="theme-color" content="#060911">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              950: '#022c22',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
            outfit: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #060911;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .glass-panel {
      background: rgba(11, 17, 30, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-bg-1 {
      position: absolute;
      top: -15%;
      left: 15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .glow-bg-2 {
      position: absolute;
      bottom: -15%;
      right: 15%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body class="p-4 selection:bg-emerald-500 selection:text-white">

  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <div class="w-full max-w-md glass-panel rounded-3xl p-8 relative z-10 shadow-2xl border border-slate-800">
    <!-- Brand Header -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-400 to-indigo-500 p-0.5 shadow-xl mb-3">
        <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
          <i data-lucide="shield-check" class="w-6 h-6 text-emerald-400"></i>
        </div>
      </div>
      <h1 class="text-2xl font-black tracking-tight font-outfit text-white flex items-center gap-2">
        <span>VELOXIS</span>
        <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-500/40">SaaS 4.0</span>
      </h1>
      <p class="text-xs text-slate-400 mt-1 font-mono">Enterprise RIA Wealth Management</p>
    </div>

    <!-- Tab Toggle -->
    <div class="grid grid-cols-2 p-1 bg-slate-950/80 rounded-2xl border border-slate-800/80 mb-6">
      <button id="tabBtnLogin" onclick="switchAuthTab('login')" class="py-2 text-xs font-bold rounded-xl transition-all bg-emerald-600 text-white shadow-md">
        Sign In
      </button>
      <button id="tabBtnRegister" onclick="switchAuthTab('register')" class="py-2 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white">
        Create Account
      </button>
    </div>

    <!-- Alert / Notice Box -->
    <div id="authAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-mono border"></div>

    <!-- Sign In Form -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 font-mono">Advisor Email</label>
        <div class="relative">
          <input type="email" id="loginEmail" required placeholder="advisor@apexwealth.com" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors pl-10" />
          <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-medium text-slate-400 font-mono">Password</label>
          <a href="#" onclick="handleForgotPassword(event)" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-mono">Forgot?</a>
        </div>
        <div class="relative">
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors pl-10" />
          <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
        </div>
      </div>

      <button type="submit" id="loginSubmitBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm shadow-lg shadow-emerald-950 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span id="loginBtnText">Sign In to Workspace</span>
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 font-mono">Advisor Full Name</label>
        <div class="relative">
          <input type="text" id="regName" required placeholder="e.g. Alex Morgan, CFP®" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors pl-10" />
          <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 font-mono">RIA Firm Name</label>
        <div class="relative">
          <input type="text" id="regFirm" required placeholder="e.g. Summit Wealth Partners RIA" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors pl-10" />
          <i data-lucide="building" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 font-mono">Work Email</label>
        <div class="relative">
          <input type="email" id="regEmail" required placeholder="alex@summitwealth.com" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors pl-10" />
          <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 font-mono">Password (min 6 chars)</label>
        <div class="relative">
          <input type="password" id="regPassword" required minlength="6" placeholder="••••••••" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition-colors pl-10" />
          <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
        </div>
      </div>

      <button type="submit" id="regSubmitBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg shadow-indigo-950 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        <span id="regBtnText">Create Advisor Account</span>
      </button>
    </form>

    <!-- Demo Fast Pass -->
    <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
      <p class="text-[11px] text-slate-500 font-mono">
        Secured with PostgreSQL Row-Level Security (RLS) & FINRA Rule 2214 Compliance
      </p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const SUPABASE_PROJECT_URL = 'https://mlvyjrevobzaecganmgp.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_rtB-t4wWt2N6P8e_EbHHng_Wopex2g1';
    const sb = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_PUBLISHABLE_KEY);

    // Auto-check session on load
    async function checkAuthSession() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          window.location.href = '/index.html';
        }
      } catch (err) {
        console.warn('Session check error:', err);
      }
    }
    checkAuthSession();

    function switchAuthTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const btnLogin = document.getElementById('tabBtnLogin');
      const btnRegister = document.getElementById('tabBtnRegister');
      const alertBox = document.getElementById('authAlert');
      alertBox.classList.add('hidden');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        btnLogin.className = "py-2 text-xs font-bold rounded-xl transition-all bg-emerald-600 text-white shadow-md";
        btnRegister.className = "py-2 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        btnRegister.className = "py-2 text-xs font-bold rounded-xl transition-all bg-indigo-600 text-white shadow-md";
        btnLogin.className = "py-2 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white";
      }
      lucide.createIcons();
    }

    function showAlert(msg, isError = true) {
      const el = document.getElementById('authAlert');
      el.textContent = msg;
      el.className = isError 
        ? "mb-4 p-3 rounded-xl text-xs font-mono border bg-rose-500/10 border-rose-500/30 text-rose-400"
        : "mb-4 p-3 rounded-xl text-xs font-mono border bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
      el.classList.remove('hidden');
    }

    // Sign In Handler
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');
      const btnText = document.getElementById('loginBtnText');

      btn.disabled = true;
      btnText.textContent = 'Signing in...';

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          showAlert(error.message, true);
          btn.disabled = false;
          btnText.textContent = 'Sign In to Workspace';
        } else {
          showAlert('Authentication successful! Entering workspace...', false);
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 400);
        }
      } catch (err) {
        showAlert('Network error: ' + err.message, true);
        btn.disabled = false;
        btnText.textContent = 'Sign In to Workspace';
      }
    }

    // Register Handler
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const advisorName = document.getElementById('regName').value.trim();
      const firmName = document.getElementById('regFirm').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('regSubmitBtn');
      const btnText = document.getElementById('regBtnText');

      btn.disabled = true;
      btnText.textContent = 'Creating account...';

      try {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            data: {
              advisor_name: advisorName,
              firm_name: firmName
            }
          }
        });

        if (error) {
          showAlert(error.message, true);
          btn.disabled = false;
          btnText.textContent = 'Create Advisor Account';
        } else {
          if (data.session) {
            showAlert('Account created successfully! Loading workspace...', false);
            setTimeout(() => {
              window.location.href = '/index.html';
            }, 600);
          } else {
            showAlert('Registration complete! Please check your email for verification, or sign in directly.', false);
            switchAuthTab('login');
            document.getElementById('loginEmail').value = email;
          }
        }
      } catch (err) {
        showAlert('Network error: ' + err.message, true);
        btn.disabled = false;
        btnText.textContent = 'Create Advisor Account';
      }
    }

    // Forgot Password Handler
    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      if (!email) {
        showAlert('Please enter your email above before requesting a reset link.', true);
        return;
      }
      try {
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/auth.html'
        });
        if (error) showAlert(error.message, true);
        else showAlert('Password reset email sent. Please check your inbox.', false);
      } catch (err) {
        showAlert('Error: ' + err.message, true);
      }
    }
  </script>
</body>
</html>
