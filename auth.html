<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloxis AI - Login / Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 500: '#10b981' },
                        indigo: { 400: '#818cf8' },
                        space: '#060911'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #060911;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite ease-in-out alternate;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: rgba(16, 185, 129, 0.15);
            top: -100px; left: -100px;
        }
        .orb-2 {
            width: 500px; height: 500px;
            background: rgba(129, 140, 248, 0.15);
            bottom: -200px; right: -100px;
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-dark {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-dark:focus {
            border-color: #818cf8;
            outline: none;
            box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.25);
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card w-full max-w-md p-8 rounded-2xl relative z-10 mx-4">
        <div class="flex flex-col items-center mb-8">
            <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-indigo-400 rounded-xl flex items-center justify-center mb-4">
                <i data-lucide="zap" class="text-white w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Veloxis AI</h1>
        </div>

        <div class="flex border-b border-gray-700/50 mb-6">
            <button id="tab-login" class="flex-1 pb-3 text-sm font-medium transition-colors border-b-2 border-emerald-500 text-emerald-500" onclick="switchTab('login')">鐧诲綍</button>
            <button id="tab-register" class="flex-1 pb-3 text-sm font-medium transition-colors border-b-2 border-transparent text-gray-400 hover:text-gray-200" onclick="switchTab('register')">娉ㄥ唽</button>
        </div>

        <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm"></div>
        <div id="success-msg" class="hidden mb-4 p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-lg text-emerald-400 text-sm"></div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="login-email" required class="input-dark w-full px-4 py-2.5 rounded-lg text-sm text-white placeholder-gray-500 transition-all" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="login-password" required class="input-dark w-full px-4 py-2.5 rounded-lg text-sm text-white placeholder-gray-500 transition-all" placeholder="鈥⑩€⑩€⑩€⑩€⑩€⑩€⑩€?>
            </div>
            <div class="flex justify-end">
                <button type="button" onclick="handleForgotPassword()" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">蹇樿瀵嗙爜?</button>
            </div>
            <button type="submit" id="login-btn" class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-indigo-400 hover:from-emerald-400 hover:to-indigo-300 rounded-lg text-sm font-semibold text-white shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center gap-2">
                <span>鐧诲綍</span>
                <i data-lucide="loader-2" class="w-4 h-4 spinner hidden" id="login-spinner"></i>
            </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="space-y-4 hidden" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="register-email" required class="input-dark w-full px-4 py-2.5 rounded-lg text-sm text-white placeholder-gray-500 transition-all" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="register-password" required class="input-dark w-full px-4 py-2.5 rounded-lg text-sm text-white placeholder-gray-500 transition-all" placeholder="鈥⑩€⑩€⑩€⑩€⑩€⑩€⑩€?>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Confirm Password</label>
                <input type="password" id="register-confirm" required class="input-dark w-full px-4 py-2.5 rounded-lg text-sm text-white placeholder-gray-500 transition-all" placeholder="鈥⑩€⑩€⑩€⑩€⑩€⑩€⑩€?>
            </div>
            <button type="submit" id="register-btn" class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-indigo-400 hover:from-emerald-400 hover:to-indigo-300 rounded-lg text-sm font-semibold text-white shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2">
                <span>娉ㄥ唽</span>
                <i data-lucide="loader-2" class="w-4 h-4 spinner hidden" id="register-spinner"></i>
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://mlvyjrevobzaecganmgp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_rtB-t4wWt2N6P8e_EbHHng_Wopex2g1';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check session on load
        async function checkSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        }
        checkSession();

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-3 text-sm font-medium transition-colors border-b-2 border-emerald-500 text-emerald-500";
                tabRegister.className = "flex-1 pb-3 text-sm font-medium transition-colors border-b-2 border-transparent text-gray-400 hover:text-gray-200";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 pb-3 text-sm font-medium transition-colors border-b-2 border-emerald-500 text-emerald-500";
                tabLogin.className = "flex-1 pb-3 text-sm font-medium transition-colors border-b-2 border-transparent text-gray-400 hover:text-gray-200";
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
            document.getElementById('success-msg').classList.add('hidden');
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
            document.getElementById('error-msg').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const spinner = document.getElementById('login-spinner');
            
            btn.disabled = true;
            spinner.classList.remove('hidden');
            
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            
            if (error) {
                showError(error.message);
                btn.disabled = false;
                spinner.classList.add('hidden');
            } else {
                window.location.href = 'index.html';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;
            const btn = document.getElementById('register-btn');
            const spinner = document.getElementById('register-spinner');

            if (password !== confirm) {
                showError('Passwords do not match');
                return;
            }

            btn.disabled = true;
            spinner.classList.remove('hidden');

            const { data, error } = await sb.auth.signUp({ email, password });

            btn.disabled = false;
            spinner.classList.add('hidden');

            if (error) {
                showError(error.message);
            } else {
                if (data.session) {
                    window.location.href = 'onboarding.html';
                } else {
                    showSuccess('娉ㄥ唽鎴愬姛锛佽妫€鏌ラ偖绠辩‘璁ら摼鎺ワ紝鎴栫洿鎺ョ櫥褰?);
                    document.getElementById('register-form').reset();
                }
            }
        }

        async function handleForgotPassword() {
            const email = document.getElementById('login-email').value;
            if (!email) {
                showError('Please enter your email address first');
                return;
            }
            const { data, error } = await sb.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/auth.html',
            });
            if (error) {
                showError(error.message);
            } else {
                showSuccess('Password reset link sent to your email');
            }
        }
    </script>
</body>
</html>
